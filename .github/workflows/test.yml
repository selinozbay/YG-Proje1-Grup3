name: CI Test ve Kalite Kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-types:
    name: Lint, Tip Kontrolü ve Derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kurulumu (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Kod Denetimi (Oxlint + ESLint)
        run: npm run lint

      - name: TypeScript Tip Kontrolü
        run: npm run type-check

      - name: Projeyi Derle (Build)
        run: npm run build

  unit-and-component-tests:
    name: Birim ve Bileşen Testleri (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kurulumu (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Vitest Birim ve Store Testlerini Koş
        run: npm test

  e2e-tests:
    name: Uçtan Uca Arayüz Testleri (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kurulumu (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Playwright Chromium Kurulumu
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Testlerini Koş (Demo Modu)
        run: npm run test:e2e

  rules-tests:
    name: Firebase Emülatör Testleri (kurallar, giriş, kullanıcı verisi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kurulumu (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Java Kurulumu (Firebase Emulator için)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Firebase CLI Kurulumu
        run: npm install -g firebase-tools

      - name: Auth ve Firestore Emülatörleriyle Kural, Giriş ve Veri Testleri
        run: npm run test:firebase
